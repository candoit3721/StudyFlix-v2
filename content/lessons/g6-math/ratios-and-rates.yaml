title: Ratios and Rates
summary: Compare quantities with ratios, write them in lowest terms, find missing numbers, and use unit rates to find the better buy.
icon: scale
minutes: 35
expectations: [B2]
objectives:
  - Write a ratio three ways, with its terms in the right order.
  - Write a ratio in lowest terms by dividing by the greatest common factor.
  - Find a missing number in equivalent ratios with a scale factor.
  - Tell a rate from a ratio, and find a unit rate by dividing.
  - Use unit prices to choose the better buy.
blocks:
  - type: explainer
    id: what-is-a-ratio
    title: Comparing with a ratio
    markdown: |
      A **ratio** compares two quantities.

      Picture a bag with 3 red marbles and 4 blue marbles. The ratio of red marbles to blue marbles is 3 to 4.

      You can write that ratio in three ways: **3&nbsp;:&nbsp;4**, **3 to 4**, or as a fraction, $\frac{3}{4}$. The two numbers are the **terms** of the ratio.

      Order matters. Red to blue is 3&nbsp;:&nbsp;4, but blue to red is 4&nbsp;:&nbsp;3. Write the terms in the same order as the words.

  - type: explainer
    id: equivalent-ratios
    title: Equivalent ratios and lowest terms
    markdown: |
      Multiply or divide **both** terms of a ratio by the same number (not zero), and you get an **equivalent ratio**. It makes the same comparison.

      The number you multiply or divide by is the **scale factor**.

      | Ratio | Both terms | Equivalent ratio |
      |---|---|---|
      | 3&nbsp;:&nbsp;4 | × 2 | 6&nbsp;:&nbsp;8 |
      | 3&nbsp;:&nbsp;4 | × 3 | 9&nbsp;:&nbsp;12 |
      | 10&nbsp;:&nbsp;15 | ÷ 5 | 2&nbsp;:&nbsp;3 |

      A ratio is in **lowest terms** when the only common factor of its terms is 1. So 3&nbsp;:&nbsp;4 is in lowest terms, but 6&nbsp;:&nbsp;8 is not, because 6 and 8 share the factor 2.

      To write a ratio in lowest terms, divide both terms by their **greatest common factor** (GCF).

  - type: example
    id: simplify-18-24
    title: Write a ratio in lowest terms
    problem: "A class garden has 18 tomato plants and 24 pepper plants. Write the ratio of tomato plants to pepper plants, 18&nbsp;:&nbsp;24, in lowest terms."
    steps:
      - "List the factors of 18: 1, 2, 3, 6, 9, 18."
      - "List the factors of 24: 1, 2, 3, 4, 6, 8, 12, 24."
      - The greatest factor in both lists is 6, so the GCF is 6.
      - Divide both terms by 6. 18 ÷ 6 = 3 and 24 ÷ 6 = 4.
    answer: "18&nbsp;:&nbsp;24 = **3&nbsp;:&nbsp;4**. There are 3 tomato plants for every 4 pepper plants."

  - type: example
    id: missing-term
    title: Find a missing number
    problem: "A paint mix uses 3&nbsp;L of blue paint for every 5&nbsp;L of yellow paint. How much yellow paint goes with 12&nbsp;L of blue? Find the missing number: 3&nbsp;:&nbsp;5 = 12&nbsp;:&nbsp;?"
    steps:
      - Look at the terms you know. The first terms are 3 and 12.
      - 3 × 4 = 12, so the scale factor is 4.
      - "Equivalent ratios multiply **both** terms by the same number. Multiply the other term by 4 too: 5 × 4 = 20."
    answer: "3&nbsp;:&nbsp;5 = 12&nbsp;:&nbsp;**20**, so 12&nbsp;L of blue paint goes with 20&nbsp;L of yellow paint."

  - type: explainer
    id: rates
    title: Rates and unit rates
    markdown: |
      A **rate** compares two quantities measured in different units, such as kilometres and hours, or dollars and kilograms.

      "180&nbsp;km in 2&nbsp;hours" is a rate. "3 red marbles to 4 blue marbles" is a ratio, because both terms count marbles.

      A **unit rate** tells you how much there is for **one** unit of the second quantity. A speed of 90&nbsp;km/h (kilometres per hour) means 90&nbsp;km in 1&nbsp;hour.

      To find a unit rate, divide. 180&nbsp;km in 2&nbsp;hours is 180 ÷ 2 = 90&nbsp;km in 1&nbsp;hour, or 90&nbsp;km/h.

      Unit rates help you shop. A 2&nbsp;L jug of juice for 6&nbsp;dollars costs 6 ÷ 2 = 3&nbsp;dollars per litre. A 3&nbsp;L jug for 7.50&nbsp;dollars costs 7.50 ÷ 3 = 2.50&nbsp;dollars per litre. The lower price per litre is the better buy, so the 3&nbsp;L jug wins.

  - type: example
    id: cyclist-unit-rate
    title: Find a cyclist's unit rate
    problem: A cyclist rides 54&nbsp;km in 3&nbsp;hours at a steady speed. How far does she ride in 1&nbsp;hour?
    steps:
      - The rate is 54&nbsp;km in 3&nbsp;hours. You want the distance for 1&nbsp;hour.
      - Divide the distance by the time. 54 ÷ 3 = 18.
      - Check by multiplying. 18&nbsp;km in each of 3&nbsp;hours is 18 × 3 = 54&nbsp;km.
    answer: The unit rate is **18&nbsp;km/h**, or 18&nbsp;km in each hour.

  - type: flashcards
    id: key-words
    title: Key words
    cards:
      - front: Ratio
        back: "A comparison of two quantities, such as 3&nbsp;:&nbsp;4 or 3 to 4. The order of the terms matters."
      - front: Equivalent ratios
        back: "Ratios that make the same comparison. You get one by multiplying or dividing both terms by the same number, such as 3&nbsp;:&nbsp;4 = 6&nbsp;:&nbsp;8."
      - front: Scale factor
        back: The number you multiply or divide both terms by to get an equivalent ratio.
      - front: GCF
        back: The greatest common factor, the greatest number that divides evenly into both numbers. The GCF of 18 and 24 is 6.
      - front: Lowest terms
        back: "A ratio is in lowest terms when the only common factor of its terms is 1, such as 3&nbsp;:&nbsp;4."
      - front: Rate
        back: A comparison of two quantities measured in different units, such as 180&nbsp;km in 2&nbsp;hours.
      - front: Unit rate
        back: A rate for one unit of the second quantity, such as 90&nbsp;km/h, which means 90&nbsp;km in 1&nbsp;hour.

  - type: quiz
    id: check
    title: Check your understanding
    items:
      - kind: choice
        prompt: A fruit bowl has 3 apples and 4 pears. Which ratio compares apples to pears?
        choices: ["3 to 4", "4 to 3", "4 : 3", "3 : 7"]
        answer: "3 to 4"
        explanation: "Apples come first in the words, so they come first in the ratio. 4&nbsp;:&nbsp;3 is pears to apples, and 3&nbsp;:&nbsp;7 compares apples to all the fruit."
      - kind: choice
        prompt: A class has 12 girls and 15 boys. What is the ratio of boys to girls in lowest terms?
        choices: ["5 : 4", "4 : 5", "15 : 12", "3 : 5"]
        answer: "5 : 4"
        explanation: "Boys come first, so start with 15&nbsp;:&nbsp;12. The GCF of 15 and 12 is 3. 15 ÷ 3 = 5 and 12 ÷ 3 = 4, so the ratio is 5&nbsp;:&nbsp;4."
      - kind: number
        prompt: "Find the missing number: 2&nbsp;:&nbsp;3 = 10&nbsp;:&nbsp;?"
        answer: 15
        explanation: 2 × 5 = 10, so the scale factor is 5. Multiply the other term by 5 too. 3 × 5 = 15.
      - kind: choice
        prompt: Which of these is a rate?
        choices: ["180 km in 2 hours", "3 red marbles to 5 blue marbles", "250 mL of juice to 750 mL of water"]
        answer: "180 km in 2 hours"
        explanation: A rate compares quantities in different units. Kilometres and hours are different units. The other two compare marbles to marbles and millilitres to millilitres.
      - kind: number
        prompt: A car travels 270&nbsp;km in 3&nbsp;hours at a steady speed. What is its speed?
        answer: 90
        unit: km/h
        explanation: Divide the distance by the time. 270 ÷ 3 = 90, so the speed is 90&nbsp;km/h.
      - kind: choice
        prompt: Store A sells 3&nbsp;kg of apples for 9&nbsp;dollars. Store B sells 5&nbsp;kg of apples for 13&nbsp;dollars. Which is the better buy?
        choices: ["Store A", "Store B", "They cost the same per kilogram"]
        answer: "Store B"
        explanation: Find each price for 1&nbsp;kg. Store A is 9 ÷ 3 = 3&nbsp;dollars per kilogram. Store B is 13 ÷ 5 = 2.60&nbsp;dollars per kilogram. Store B has the lower price per kilogram.

  - type: practice
    id: practice
    title: Practise ratios and rates
    generator: ratios-rates
    params: { mode: mixed }
    count: 8
